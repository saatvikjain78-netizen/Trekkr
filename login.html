<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Trekkr - Login</title><link rel="stylesheet" href="style.css"></head>
<body>
    <header><h1>Trekkr</h1><p>Find The Peak</p><nav><a href="index.html">Home</a><a href="destinations.html">Destinations</a><a href="gallery.html">Gallery</a><a href="trekregister.html">Register</a><a class="active" href="login.html">Login</a><a href="contact.html">Contact</a></nav></header>
    <main>
        <section class="page-title"><h2>Login</h2><p>Login to view your Trekkr details.</p></section>
        <section class="section">
            <form onsubmit="loginUser(event)">
                <label for="loginEmail">Email:</label><input id="loginEmail" type="email" placeholder="Enter your email" required>
                <label for="password">Password:</label><input id="password" type="password" placeholder="Enter your password" required>
                <button class="button" type="submit">Login</button>
                <p id="loginMessage"></p>
            </form>
        </section>
    </main>
    <footer><p>© 2026 Trekkr · Find The Peak</p></footer>
    <script>
        function loginUser(event) {
            event.preventDefault();
            alert("Login successful! Welcome to TrailQuest.");
            window.location.href = "home.html";
        }
    </script>
</body>
</html>
